    <style>
        body { font-family: 'Lexend', sans-serif; }

        /* Animación de brillo espejo */
        @keyframes brillo {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        .efecto-espejo {
            position: relative;
            overflow: hidden;
        }

        .efecto-espejo::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right, 
                rgba(255, 255, 255, 0) 0%, 
                rgba(255, 255, 255, 0.7) 50%, 
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            animation: brillo 3.5s infinite ease-in-out;
        }

        /* Animación de latido suave para los botones */
        @keyframes latidoSuave {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 12px rgba(63, 148, 194, 0.4);
            }
        }

        .btn-palpitante {
            animation: latidoSuave 2s infinite ease-in-out;
        }
        .btn-palpitante:active {
            transform: scale(0.9) !important;
        }

        /* Animación de la flecha azul (desplazamiento horizontal controlado) */
        @keyframes flechaSenalando {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .flecha-animada {
            color: #3f94c2;
            animation: flechaSenalando 1.2s infinite ease-in-out;
        }
    </style>
</head>
